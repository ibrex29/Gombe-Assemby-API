# Edge reverse proxy (Caddy) — staging / production
# Joins shared network so it can reach api (this stack) and web (web stack).
#
# Usage:
#   make infra-staging-up   # includes --profile edge
#   make infra-prod-up

services:
  caddy:
    profiles: ["edge"]
    image: caddy:2.9-alpine
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    environment:
      WEB_HOST: ${WEB_HOST:?WEB_HOST is required for edge}
      API_HOST: ${API_HOST:?API_HOST is required for edge}
      ACME_EMAIL: ${ACME_EMAIL:-ops@electromon.ng}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - electromon
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
