# Pantamiyya Assembly API — sidecar on the shared Governorship database.
#
# Same Postgres/Redis/MinIO as electromon-pantamiyya. DEFAULT_CONTEST=assembly.
# Workers stay off so this process does not consume Governorship IReV queues.
#
#   ./infra/scripts/deploy-pantamiyya-assembly-droplet.sh

name: electromon-pantamiyya-assembly

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-db-url: &db-url "postgresql://${PANTAMIYYA_POSTGRES_USER:-electromon}:${PANTAMIYYA_POSTGRES_PASSWORD}@electromon-pantamiyya-postgres:5432/${PANTAMIYYA_POSTGRES_DB:-electromon_pantamiyya}?schema=public"

x-api-env: &api-env
  NODE_ENV: ${NODE_ENV:-production}
  DEPLOYMENT_STATE_CODE: GO
  DEPLOYMENT_CLIENT_PARTY_CODE: PDP
  DEFAULT_CONTEST: assembly
  DISABLE_BACKGROUND_WORKERS: "true"
  IREV_ENABLED: "false"
  IREV_BOOTSTRAP_ON_START: "false"
  IREV_ELECTION_TYPE: ASSEMBLY
  IREV_ELECTION_LABEL: Gombe State House of Assembly Election
  IREV_FETCH_QUEUE: irev.fetch.pantamiyya.assembly
  DATABASE_URL: *db-url
  REDIS_URL: ${PANTAMIYYA_ASSEMBLY_REDIS_URL:-redis://electromon-pantamiyya-redis:6379/3}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
  JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-15m}
  JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-7d}
  S3_ENDPOINT: ${PANTAMIYYA_ASSEMBLY_S3_ENDPOINT:-http://electromon-pantamiyya-minio:9000}
  S3_ACCESS_KEY: ${PANTAMIYYA_S3_ACCESS_KEY:-electromon_pantamiyya}
  S3_SECRET_KEY: ${PANTAMIYYA_S3_SECRET_KEY:?PANTAMIYYA_S3_SECRET_KEY is required}
  S3_BUCKET: ${PANTAMIYYA_S3_BUCKET:-electromon-pantamiyya}
  S3_REGION: ${S3_REGION:-us-east-1}
  API_PORT: "3001"
  API_PUBLIC_URL: ${PANTAMIYYA_ASSEMBLY_API_PUBLIC_URL:-http://127.0.0.1:${PANTAMIYYA_ASSEMBLY_API_PORT:-5303}}
  CORS_ORIGIN: ${PANTAMIYYA_ASSEMBLY_CORS_ORIGIN:-https://assembly.pantamiyyaa.alphabetandnumbers.com}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
  FCM_DRY_RUN: ${FCM_DRY_RUN:-false}
  GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
  GOOGLE_CLOUD_VISION_CREDENTIALS: ${GOOGLE_CLOUD_VISION_CREDENTIALS:-}
  GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-}
  AI_OCR_MODEL: ${AI_OCR_MODEL:-}
  AI_READONLY_DATABASE_URL: ${AI_READONLY_DATABASE_URL:-}
  SOCIAL_INGEST_TOKEN: ${SOCIAL_INGEST_TOKEN:-}
  PULSEFORGE_API_KEY: ${PULSEFORGE_API_KEY:-}
  PULSEFORGE_BASE_URL: ${PULSEFORGE_BASE_URL:-https://pulseforge.vercel.app/api/v1}
  AI_SOCIAL_MODEL: ${AI_SOCIAL_MODEL:-}
  SITUATION_ROOM_CACHE_TTL_SEC: ${SITUATION_ROOM_CACHE_TTL_SEC:-10}
  CLOUDINARY_URL: ${CLOUDINARY_URL:-}
  CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
  CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
  CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
  CLOUDINARY_FOLDER: ${PANTAMIYYA_CLOUDINARY_FOLDER:-electromon/pantamiyya/uploads}
  SUPPORTED_STATE_CODES: GO
  TRIAGE_SWEEP_ENABLED: "false"

services:
  migrate:
    container_name: electromon-pantamiyya-assembly-migrate
    build:
      context: .
      dockerfile: infra/dockerfiles/migrate.Dockerfile
    environment:
      DATABASE_URL: *db-url
      RUN_SEED: "false"
    restart: "no"
    networks:
      - pantamiyya

  sha-apply:
    container_name: electromon-pantamiyya-assembly-sha-apply
    build:
      context: .
      dockerfile: infra/dockerfiles/pantamiyya-seed.Dockerfile
    entrypoint: ["/entrypoint-sha.sh"]
    environment:
      DATABASE_URL: *db-url
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - pantamiyya

  api:
    container_name: electromon-pantamiyya-assembly-api
    build:
      context: .
      dockerfile: infra/dockerfiles/api.Dockerfile
    env_file:
      - .env.pantamiyya-assembly
    environment:
      <<: *api-env
    ports:
      - "${PANTAMIYYA_ASSEMBLY_API_PORT:-5303}:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/v1/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - pantamiyya_assembly_uploads:/app/uploads
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - pantamiyya
    logging: *default-logging

networks:
  pantamiyya:
    name: electromon-pantamiyya
    external: true

volumes:
  pantamiyya_assembly_uploads:
