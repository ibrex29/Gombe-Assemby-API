# Electromon — shared infrastructure services (deps only: postgres, redis, rabbitmq, minio).
# The Nest API is NOT here — it lives in apps.yml (profile "apps") and in
# infra/compose/dokploy.yml (Dokploy: attach domain to service "api", port 3002).
# Explicit project name (avoids Docker Desktop labeling the stack "compose"
# because compose files live under infra/compose/).

name: ${COMPOSE_PROJECT_NAME:-electromon-local}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-electromon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-electromon}
      POSTGRES_DB: ${POSTGRES_DB:-electromon}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/scripts/init-postgres.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-electromon} -d ${POSTGRES_DB:-electromon}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    networks:
      - electromon

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    networks:
      - electromon

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    command: >
      sh -c "rabbitmq-plugins enable --offline rabbitmq_prometheus &&
             docker-entrypoint.sh rabbitmq-server"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-electromon}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-electromon}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    networks:
      - electromon

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-electromon}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-electromonsecret}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging
    networks:
      - electromon

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-electromon}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-electromonsecret}
      S3_BUCKET: ${S3_BUCKET:-electromon}
    entrypoint: /bin/sh
    command: /scripts/init-minio.sh
    volumes:
      - ./infra/scripts/init-minio.sh:/scripts/init-minio.sh:ro
    restart: "no"
    networks:
      - electromon

networks:
  electromon:
    # Stable name so electromon-web can join the same network across repos.
    name: ${COMPOSE_NETWORK_NAME:-electromon}
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  api_uploads:
