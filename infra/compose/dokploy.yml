# Electromon API — single-file stack for Dokploy
#
# Dokploy UI (required):
#   Compose file: infra/compose/dokploy.yml
#   Isolated Deployments: ON
#   Advanced → Command: leave EMPTY (delete any custom command)
#   Domain → service: api  ·  container port: 3002  ·  HTTPS on
#
# Dokploy writes Environment vars to a .env next to this file.
# Secrets are injected via env_file (not ${VAR:?} interpolation), because
# a custom --project-directory . does not load that .env and the deploy fails.
#
# Do not include Caddy. Dokploy Traefik already binds 80/443.

name: ${COMPOSE_PROJECT_NAME:-electromon}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: electromon
      POSTGRES_DB: electromon
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/scripts/init-postgres.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U electromon -d electromon"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: electromon
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 30s
      retries: 10
      start_period: 90s
    logging: *default-logging

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - .env
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - .env
    entrypoint: /bin/sh
    command: /scripts/init-minio.sh
    volumes:
      - ./infra/scripts/init-minio.sh:/scripts/init-minio.sh:ro
    restart: "no"

  migrate:
    build:
      context: .
      dockerfile: infra/dockerfiles/migrate.Dockerfile
    env_file:
      - .env
    environment:
      RUN_SEED: "false"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    

  api:
    build:
      context: .
      dockerfile: infra/dockerfiles/api.Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      API_PORT: "3002"
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "3002"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/api/v1/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    volumes:
      - api_uploads:/app/uploads
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  api_uploads:
