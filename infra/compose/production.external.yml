# Production with external managed PostgreSQL + S3 (DigitalOcean Spaces)
# Local postgres/minio remain defined in base.yml but are not started by
# `make infra-prod-external-up` (explicit service list).

services:
  migrate:
    depends_on: {}
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      RUN_SEED: "false"

  api:
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT is required}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      S3_REGION: ${S3_REGION:-nyc3}
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN is required}
