# Observability stack — Prometheus, Grafana, Loki, Alertmanager
# Ports: see observability.local.yml (local) or observability.secure.yml (staging/prod)

services:
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.55.1
    container_name: electromon-prometheus
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      METRICS_TOKEN_FILE: /etc/prometheus/metrics_token
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/prometheus/alerts:/etc/prometheus/alerts:ro
      - ./infra/scripts/entrypoint-prometheus.sh:/entrypoint.sh:ro
      - prometheus_data:/prometheus
    networks:
      - electromon
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  alertmanager:
    profiles: ["observability"]
    image: prom/alertmanager:v0.27.0
    container_name: electromon-alertmanager
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    command:
      - --config.file=/tmp/alertmanager.yml
      - --storage.path=/alertmanager
    environment:
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-http://127.0.0.1:65535/alert}
      ALERT_SLACK_WEBHOOK_URL: ${ALERT_SLACK_WEBHOOK_URL:-}
      ALERT_SLACK_CHANNEL: ${ALERT_SLACK_CHANNEL:-#electromon-alerts}
    volumes:
      - ./infra/scripts/entrypoint-alertmanager.sh:/entrypoint.sh:ro
      - alertmanager_data:/alertmanager
    networks:
      - electromon

  loki:
    profiles: ["observability"]
    image: grafana/loki:3.3.2
    container_name: electromon-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./infra/observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    networks:
      - electromon

  promtail:
    profiles: ["observability"]
    image: grafana/promtail:3.3.2
    container_name: electromon-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./infra/observability/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    networks:
      - electromon

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.4.0
    container_name: electromon-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-electromon}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3030}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - electromon

  redis-exporter:
    profiles: ["observability"]
    image: oliver006/redis_exporter:v1.66.0
    container_name: electromon-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    networks:
      - electromon

  postgres-exporter:
    profiles: ["observability"]
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: electromon-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-electromon}:${POSTGRES_PASSWORD:-electromon}@postgres:5432/${POSTGRES_DB:-electromon}?sslmode=disable
    networks:
      - electromon

volumes:
  prometheus_data:
  alertmanager_data:
  loki_data:
  grafana_data:
