# Local full stack — infrastructure + API in Docker (web runs separately)

services:
  migrate:
    container_name: electromon-local-migrate
    environment:
      RUN_SEED: ${RUN_SEED:-true}

  api:
    container_name: electromon-local-api
    ports:
      - "${API_PORT:-3001}:3001"
    environment:
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:3001}
    volumes:
      - api_uploads:/app/uploads

volumes:
  api_uploads:
