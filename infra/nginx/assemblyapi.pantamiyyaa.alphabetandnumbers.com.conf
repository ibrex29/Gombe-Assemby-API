# Pantamiyya Assembly API
#
#   sudo cp infra/nginx/assemblyapi.pantamiyyaa.alphabetandnumbers.com.conf \
#     /etc/nginx/conf.d/assemblyapi.pantamiyyaa.alphabetandnumbers.com.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d assemblyapi.pantamiyyaa.alphabetandnumbers.com
#
# Upstream: Assembly API on host port 5303

server {
    listen 80;
    listen [::]:80;
    server_name assemblyapi.pantamiyyaa.alphabetandnumbers.com;
    include /etc/nginx/snippets/security-headers.conf;

    client_max_body_size 25m;

    location /api/v1/ai/assistant/chat {
        proxy_pass http://127.0.0.1:5303;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:5303;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
