# Pantamiyya API (Gombe-only Electromon branch)
#
# Install on the Droplet:
#   sudo cp infra/nginx/api.pantamiyya.alphabetandnumbers.com.conf \
#     /etc/nginx/conf.d/api.pantamiyya.alphabetandnumbers.com.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.pantamiyya.alphabetandnumbers.com
#
# Upstream: Pantamiyya sidecar on host port 5301

server {
    listen 80;
    listen [::]:80;
    server_name api.pantamiyya.alphabetandnumbers.com;
    include /etc/nginx/snippets/security-headers.conf;

    client_max_body_size 25m;

    # Intelligence chat streams NDJSON for up to ~120s; default nginx 60s causes
    # "network error" in the browser when the proxy aborts mid-answer.
    location /api/v1/ai/assistant/chat {
        proxy_pass http://127.0.0.1:5301;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:5301;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
