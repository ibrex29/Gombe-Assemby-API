# Install on the Droplet (HTTP first, then Certbot):
#   sudo cp infra/nginx/api.electromon.iexportcalc.com.conf \
#     /etc/nginx/conf.d/api.electromon.iexportcalc.com.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.electromon.iexportcalc.com
#
# Upstream: Docker publishes Electromon API on host port 5300
#   (make infra-full → api on :5300)

server {
    listen 80;
    listen [::]:80;
    server_name api.electromon.iexportcalc.com;
    include /etc/nginx/snippets/security-headers.conf;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:5300;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
}
